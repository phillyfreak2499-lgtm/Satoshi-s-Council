<button type="button" id="tabFollower" class="mode-tab" data-mode="follower" title="Follow the Chair locks">Follower</button>
<section id="followerView" class="info-view hidden" aria-label="Follower desk">
  <div class="info-hero">
    <h2>FOLLOWER</h2>
    <p>Chair locks only. Live needs a typed confirm and an arming delay. LAW, huddle, and sick feeds still refuse.</p>
  </div>
  <div class="follower-arm">
    <div class="follower-arm-row">
      <span id="followerLiveState" class="follower-live-state">LIVE OFF</span>
      <span id="followerArmWait" class="follower-arm-wait"></span>
    </div>
    <label class="fg-lock-label" for="followerLiveConfirm">Type LIVE to arm
      <input type="text" id="followerLiveConfirm" class="password-input" placeholder="LIVE" autocomplete="off" />
    </label>
    <div class="admin-actions">
      <button type="button" id="followerArmBtn" class="gate-btn gate-btn-summon">Arm Live</button>
      <button type="button" id="followerLiveOffBtn" class="gate-btn gate-btn-ghost">Live OFF</button>
    </div>
    <p id="followerArmNote" class="settings-foot">Closing this tab drops Live to OFF. Idle re-locks the desk.</p>
  </div>
  <div id="followerBoards" class="follower-boards"></div>
  <div class="follower-order">
    <div class="beast-title">ORDER</div>
    <label class="set-field">Asset
      <select id="followerOrderAsset">
        <option value="btc">BTC</option>
        <option value="eth">ETH</option>
      </select>
    </label>
    <label class="set-field">Side
      <select id="followerOrderSide">
        <option value="UP">UP</option>
        <option value="DOWN">DOWN</option>
      </select>
    </label>
    <label class="set-field">Stake
      <input type="number" id="followerOrderStake" min="1" max="10000" step="1" value="25" />
    </label>
    <label class="set-field">Contracts
      <input type="number" id="followerOrderContracts" min="1" max="20" step="1" value="1" />
    </label>
    <label class="fg-lock-label" for="followerOrderConfirm">First live order — type LIVE
      <input type="text" id="followerOrderConfirm" class="password-input" placeholder="LIVE" autocomplete="off" />
    </label>
    <div class="admin-actions">
      <button type="button" id="followerPaperBtn" class="gate-btn gate-btn-ghost">Paper</button>
      <button type="button" id="followerLiveBtn" class="gate-btn gate-btn-summon">Send live</button>
    </div>
    <p id="followerOrderStatus" class="settings-foot"></p>
  </div>
</section>
<style>
.fg-card { width: min(400px, 94vw); }
.fg-lock-label, .follower-arm .fg-lock-label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #7a8aaa;
  margin-top: 10px;
}
.fg-lock-label .password-input { width: 100%; margin-top: 4px; box-sizing: border-box; }
.fg-lock-label .password-input:disabled { opacity: 0.45; }
.desk-ext-btn { min-width: 44px; }
.follower-boards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  max-width: 920px;
}
.follower-card-lock {
  padding: 16px 18px;
  border-radius: 12px;
  background: linear-gradient(160deg, #0e1428, #0a0e1c);
  border: 1px solid rgba(120, 160, 255, 0.22);
}
.follower-card-lock .fc-chair {
  font-family: Orbitron, sans-serif;
  letter-spacing: 0.14em;
  font-size: 12px;
  color: #9ec5ff;
}
.follower-card-lock .fc-dir {
  font-family: Orbitron, sans-serif;
  font-size: 28px;
  margin: 8px 0 4px;
}
.follower-card-lock .fc-dir.UP { color: #4ade80; }
.follower-card-lock .fc-dir.DOWN { color: #f87171; }
.follower-card-lock .fc-dir.WAIT { color: #94a3b8; }
.follower-card-lock .fc-meta { font-size: 13px; color: #9aa8c2; line-height: 1.45; }
.follower-arm, .follower-order {
  max-width: 520px;
  margin: 12px 0 18px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(120, 160, 255, 0.18);
  background: rgba(8, 12, 24, 0.55);
}
.follower-live-state { font-family: Orbitron, sans-serif; letter-spacing: 0.12em; }
.follower-live-state.on { color: #f87171; }
.follower-arm-wait { margin-left: 10px; color: #9aa8c2; font-size: 12px; }
body.mode-follower #tabFollower,
body.mode-follower #tabFollower.active {
  color: var(--blade) !important;
  border-color: rgba(0, 232, 255, 0.5) !important;
  background: rgba(0, 232, 255, 0.08) !important;
}
</style>
