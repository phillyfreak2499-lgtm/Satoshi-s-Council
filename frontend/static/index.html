<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satoshi’s Council</title>
  <style>html,body{margin:0;background:#07070c;color:#c9a44a;font-family:sans-serif}#boot{padding:24px;max-width:28rem}</style>
</head>
<body>
  <p id="boot">Opening the desk…</p>
  <script>
  (function () {
    var urls = [
      "https://cdn.jsdelivr.net/gh/phillyfreak2499-lgtm/Satoshi-s-Council@9cc3ec130c15e999d4ceff5b453ba3ef092ea083/frontend/static/index.html",
      "https://raw.githubusercontent.com/phillyfreak2499-lgtm/Satoshi-s-Council/9cc3ec130c15e999d4ceff5b453ba3ef092ea083/frontend/static/index.html",
      "https://cdn.jsdelivr.net/gh/phillyfreak2499-lgtm/Satoshi-s-Council@e3ce9c374431662f44e9417b813b17b2bc5d0a96/frontend/static/index.html",
      "https://raw.githubusercontent.com/phillyfreak2499-lgtm/Satoshi-s-Council/e3ce9c374431662f44e9417b813b17b2bc5d0a96/frontend/static/index.html"
    ];
    function paint(html) {
      document.open();
      document.write(html);
      document.close();
    }
    function tryUrl(i) {
      if (i >= urls.length) {
        document.getElementById("boot").innerHTML =
          "Could not load the desk from GitHub.<br>Turn off airplane mode, then refresh.";
        return;
      }
      fetch(urls[i], { cache: "no-store", mode: "cors" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (t) {
          if (!t || t.indexOf("passwordSubmit") === -1) throw new Error("bad html");
          paint(t);
        })
        .catch(function () { tryUrl(i + 1); });
    }
    tryUrl(0);
  })();
  </script>
</body>
</html>
