<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satoshi’s Council</title>
  <style>html,body{margin:0;background:#07070c;color:#c9a44a;font-family:sans-serif}#boot{padding:24px}</style>
</head>
<body>
  <p id="boot">Opening the desk…</p>
  <script>
  (function () {
    var n = 5;
    var boot = document.getElementById("boot");
    function fail() {
      boot.textContent = "Desk still loading. Wait one minute, then refresh.";
    }
    function paint(html) {
      if (!html || html.indexOf("passwordSubmit") === -1) { fail(); return; }
      document.open();
      document.write(html);
      document.close();
    }
    Promise.all(
      Array.from({ length: n }, function (_, i) {
        return fetch("/static/desk-" + i + ".b64?v=1", { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.text();
        });
      })
    )
      .then(function (parts) {
        var b64 = parts.join("").replace(/\s/g, "");
        var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
        if (typeof DecompressionStream === "undefined") throw new Error("no gzip");
        return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      })
      .then(paint)
      .catch(fail);
  })();
  </script>
</body>
</html>
