<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satoshi’s Council</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <style>html,body{margin:0;background:#07070c;color:#c9a44a;font-family:sans-serif}#boot{padding:24px;line-height:1.45}button{margin-top:12px;background:transparent;color:#c9a44a;border:1px solid #c9a44a;border-radius:999px;padding:10px 16px}</style>
</head>
<body>
  <p id="boot">Opening the desk…</p>
  <script>
  (function () {
    var n = 12;
    var boot = document.getElementById("boot");
    var tries = 0;
    function paint(html) {
      if (!html || html.indexOf("passwordSubmit") === -1) { throw new Error("bad desk"); }
      document.open();
      document.write(html);
      document.close();
    }
    function dropCaches() {
      var jobs = [];
      if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
      }
      return Promise.all(jobs).catch(function () {});
    }
    function attempt() {
      tries += 1;
      // Unique t= per attempt so a cache-first worker can never serve a
      // stale chunk from the outage. v=4 is this unstick.
      var bust = "?v=4&t=" + Date.now() + "-" + tries;
      Promise.all(
        Array.from({ length: n }, function (_, i) {
          return fetch("/static/desk-" + i + ".b64" + bust, { cache: "no-store" }).then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.text();
          });
        })
      )
        .then(function (parts) {
          var b64 = parts.join("").replace(/\s/g, "");
          var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
          if (typeof DecompressionStream === "undefined") throw new Error("no gzip");
          return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
        })
        .then(paint)
        .catch(function () {
          if (tries >= 3) {
            boot.innerHTML = "Desk still loading (" + tries + "). On a phone that was stuck on this screen, clear site data for this site (Chrome → Site settings → Clear data), then reopen.";
            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "Retry";
            btn.onclick = function () { location.reload(); };
            boot.appendChild(document.createElement("br"));
            boot.appendChild(btn);
            setTimeout(attempt, Math.min(12000, 2500 * tries));
            return;
          }
          boot.textContent = "Desk loading… retrying (" + tries + ")";
          setTimeout(attempt, Math.min(8000, 2000 * tries));
        });
    }
    dropCaches().then(attempt);
  })();
  </script>
</body>
</html>
