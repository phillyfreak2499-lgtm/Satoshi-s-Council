<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Satoshi’s Council</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta name="description" content="Satoshi’s Council" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/fonts.css?v=20260822a" />
  <link rel="stylesheet" href="/style.css?v=20260822a" />
  <link rel="stylesheet" href="/static/phone-desk.css?v=20260822a" />
  <script src="/seat.js?v=20260822a"></script>
  <script>
  (function () {
    try { localStorage.removeItem("council_admin_unlocked"); } catch (e) {}
    var locked = false;
    try { locked = localStorage.getItem("council_seat_locked") === "1"; } catch (e) {}
    if (locked) {
      document.documentElement.classList.add("desk-unlocked");
      document.documentElement.classList.remove("gate-locked");
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("desk-unlocked");
        document.body.classList.remove("gate-locked");
        var pg = document.getElementById("passwordGate");
        if (pg) pg.classList.add("hidden");
      });
      return;
    }
    document.documentElement.classList.add("gate-locked");
    document.addEventListener("DOMContentLoaded", function () {
      document.body.classList.add("gate-locked");
      var pg = document.getElementById("passwordGate");
      if (pg) pg.classList.remove("hidden");
    });
  })();
  </script>
</head>
