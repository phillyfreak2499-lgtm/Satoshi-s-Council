<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satoshi’s Council</title>
  <style>html,body{margin:0;background:#07070c;color:#c9a44a;font-family:sans-serif}#boot{padding:24px}</style>
</head>
<body>
  <p id="boot">Opening the desk…</p>
  <script>
  (function () {
    var n = 8;
    var parts = new Array(n);
    var left = n;
    function done() {
      if (--left) return;
      var html = parts.join("");
      if (html.indexOf("passwordSubmit") === -1) {
        document.getElementById("boot").textContent = "Desk pieces still deploying. Wait 30s and refresh.";
        return;
      }
      document.open();
      document.write(html);
      document.close();
    }
    for (var i = 0; i < n; i++) {
      (function (i) {
        fetch("/index-p" + i + ".txt?v=desk1", { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (t) { parts[i] = t; done(); })
          .catch(function () {
            document.getElementById("boot").textContent = "Desk pieces still deploying. Wait 30s and refresh.";
          });
      })(i);
    }
  })();
  </script>
</body>
</html>
