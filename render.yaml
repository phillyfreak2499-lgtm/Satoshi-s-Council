# Existing Render web service: change Runtime to Node, then Manual Deploy.
# This replaces the old Python Council on the same URL.
services:
  - type: web
    name: satoshi-s-council
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: "0.0.0.0"
      - key: VITE_AUTH_ENABLED
        value: "false"
