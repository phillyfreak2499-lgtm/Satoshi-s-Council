# Satoshi's Council — Render blueprint
#
# One web service, one instance, one persistent disk.
#
# Keep the disk attached across deploys: it holds council.db, the learning
# brain, runtime settings, and the Follower audit log. Detaching it resets
# every graded call and every learned weight.
#
# Single instance is deliberate. The analysis loop lives in-process, so
# --workers 1 and one instance are the only safe shape; two would run two
# councils against one SQLite file and double every Kalshi fetch. During a
# single-instance swap Render briefly overlaps old and new containers on the
# same disk, which is why boot must not block the port — backend/main.py
# binds first and hydrates in the background.

services:
  - type: web
    name: satoshi-council
    runtime: python
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    autoDeploy: true

    disk:
      name: council-data
      mountPath: /opt/render/project/src/data
      sizeGB: 2

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONPATH
        value: "."
      - key: DATA_DIR
        value: /opt/render/project/src/data

      # Restrict to the desk origin(s) to allow cookie-bearing cross-origin
      # calls. "*" is accepted but disables credentialed CORS.
      - key: CORS_ORIGINS
        value: "*"

      # Secrets — set in the Render dashboard, never in this file.
      # COUNCIL_ADMIN_PASSWORD gates Settings, brain export/import, seat
      # backfill, and live arming. Unset = those routes stay closed.
      - key: COUNCIL_ADMIN_PASSWORD
        sync: false
      - key: COUNCIL_ACCESS_PASSWORD
        sync: false
      - key: FOLLOWER_PASSWORD_2
        sync: false
      - key: FOLLOWER_PASSWORD_3
        sync: false
      - key: COINGLASS_API_KEY
        sync: false

